[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "institutional-investor-holdings-tracker"
version = "1.0.0"
description = "SEC 13F-HR XML ingestion, PostgreSQL storage, QoQ analytics and Excel dashboard"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "pandas==2.2.3", "psycopg[binary]==3.2.10", "requests==2.32.5"]
[project.optional-dependencies]
test = ["pytest==9.0.2"]
[project.scripts]
13f-ingest = "holdings_tracker.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
